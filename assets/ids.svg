<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="Modbus packets flowing through an IDS, one flagged as an anomaly"><style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:"SFMono-Regular",Consolas,monospace}</style>
<rect width="900" height="200" rx="14" fill="#0d1117"/>
<g fill="#161b22" stroke="#30363d"><rect x="40" y="70" width="110" height="60" rx="8"/><rect x="390" y="55" width="120" height="90" rx="10" stroke="#58a6ff" stroke-width="2"/><rect x="750" y="70" width="110" height="60" rx="8"/></g>
<g fill="#c9d1d9" font-size="15" text-anchor="middle"><text x="95" y="105">PLC / RTU</text><text x="450" y="95">IDS</text><text x="450" y="118" fill="#8b949e" font-size="12">anomaly</text><text x="805" y="105">SCADA HMI</text></g>
<line x1="150" y1="100" x2="390" y2="100" stroke="#30363d" stroke-width="2"/><line x1="510" y1="100" x2="750" y2="100" stroke="#30363d" stroke-width="2"/>
<rect width="14" height="14" rx="3" fill="#3fb950" y="93"><animate attributeName="x" from="150" to="750" dur="4s" repeatCount="indefinite"/></rect>
<rect width="14" height="14" rx="3" fill="#3fb950" y="93"><animate attributeName="x" from="150" to="750" begin="2s" dur="4s" repeatCount="indefinite"/></rect>
<rect width="14" height="14" rx="3" fill="#f85149"><animate attributeName="x" values="150;380;380" keyTimes="0;0.4;1" begin="1s" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="93;93;20" keyTimes="0;0.4;1" begin="1s" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" begin="1s" dur="4s" repeatCount="indefinite"/></rect>
<text x="450" y="30" fill="#f85149" font-size="13" text-anchor="middle" class="m">ALERT: unexpected write</text>
</svg>
