<rect width="900" height="200" rx="14" fill="#0d1117"/>
<g fill="#161b22" stroke="#30363d" stroke-width="2"><rect x="40" y="75" width="110" height="50" rx="8" stroke="#f85149"/><rect x="390" y="75" width="110" height="50" rx="8"/><rect x="740" y="20" width="120" height="50" rx="8" stroke="#3fb950"/><rect x="740" y="130" width="120" height="50" rx="8" stroke="#d29922"/></g>
