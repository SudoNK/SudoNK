<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="Terminal typing sudo whoami with a shield"><style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:"SFMono-Regular",Consolas,monospace}</style>
<rect width="900" height="240" rx="14" fill="#0d1117"/>
<rect width="900" height="34" rx="14" fill="#161b22"/><circle cx="24" cy="17" r="6" fill="#ff5f56"/><circle cx="46" cy="17" r="6" fill="#ffbd2e"/><circle cx="68" cy="17" r="6" fill="#27c93f"/>
<text x="450" y="22" fill="#8b949e" font-size="13" text-anchor="middle" class="m">nk@sudo: ~</text>
<g class="m" font-size="20"><text x="30" y="80" fill="#3fb950">$ <tspan fill="#c9d1d9">sudo whoami</tspan></text>
<text x="30" y="115" fill="#58a6ff" opacity="0"><tspan>NK — Cybersecurity &amp; Blockchain Student</tspan><animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.2s" fill="freeze"/></text>
<text x="30" y="150" fill="#3fb950" opacity="0">$ ./scan --ics --modbus<animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.2s" fill="freeze"/></text>
<text x="30" y="185" fill="#f85149" opacity="0">[!] anomaly detected → redirected to honeypot<animate attributeName="opacity" values="0;1;1;0.4;1" keyTimes="0;0.1;0.5;0.75;1" begin="3s" dur="2s" repeatCount="indefinite"/></text>
<rect x="30" y="198" width="11" height="22" fill="#c9d1d9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g>
<g transform="translate(770 70)"><path d="M50 0 L100 18 V70 C100 110 75 135 50 148 C25 135 0 110 0 70 V18 Z" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
<path d="M28 72 L45 90 L74 52" fill="none" stroke="#3fb950" stroke-width="7" stroke-linecap="round" stroke-dasharray="80" stroke-dashoffset="80"><animate attributeName="stroke-dashoffset" from="80" to="0" begin="1s" dur="1s" fill="freeze"/></path></g>
</svg>
